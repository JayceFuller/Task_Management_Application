<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Personal Task Manager - Upcoming Events</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <script src="./js/events.js" defer></script>
        <script src="./js/navbar.js"></script>
    </head>

    <header>
        <div id="navbar"></div>
    </header>

    <body>
        <!-- Error Dialog -->
        <dialog id="err"></dialog>

        <!-- Event Create Form Start -->
        <dialog id="eventDialog">
            <button type="button" class="close-button" onclick="closeEventDialog()">x</button>
            <br />
            <form id="eventForm" class="form-content">
                <div class="form-field">
                    <input id="event-name" type="text" name="event-name" placeholder="Add event name" required />
                </div>

                <div class="form-field">
                    <textarea id="details" name="details" placeholder="Add description"></textarea>
                </div>

                <div class="form-field">
                    <label for="location">Location:</label><br/>
                    <input id="location" type="text" name="location" />
                </div>

                <div class="form-field">
                    <label for="start">Date: </label><br/>
                    <input id="start" type="datetime-local" name="start" required />
                    <input id="end" type="datetime-local" name="end" required />
                </div>

                <div class="form-field">
                    <select id="recurrence" name="recurrence" form="eventForm" required>
                        <option value="0" selected>Does not recurr</option>
                        <option value="1">Daily</option>
                        <option value="2">Weekly</option>
                        <option value="3">Monthly</option>
                        <option value="4">Annually</option>
                    </select>
                </div><br/>

                <div class="form-field">
                    <label for="label" class="form-label">Label:</label>
                    <select id="labelSelect" name="label" form="eventForm" required></select>
                </div>

                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Event Create Form End -->

        <!-- Label Create Form Start -->
        <dialog id="labelDialog">
            <button type="button" class="close-button" onclick="closeLabelDialog()">x</button>
            <br />
            <form id="labelForm" class="form-content">
                <div class="form-field">
                    <input id="label-name" type="text" name="label-name" placeholder="Add label name"/>
                </div>
                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Label Create Form End -->

        <div class="app">
            <h2>Upcoming Events</h2>
            <hr />
            <button class="button" onclick="openEventDialog()">+ Create Event</button>
            <button class="button" onclick="openLabelDialog()">+ Create Label</button>
            
            <div id="labels"></div>
        </div>
    </body>
</html>
