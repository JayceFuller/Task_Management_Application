<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Personal Task Manager | All Events</title>

        <link rel="stylesheet" href="./css/styles.css" />
        <script src="./js/events.js" defer></script>
        <script src="./js/calendar.js" defer></script>
        <script src="./js/navbar.js" defer></script>
        <script src="./js/shared.js" defer></script>
    </head>

    <header>
        <nav-bar></nav-bar>
    </header>

    <body>
        <!-- Event Form Start -->
        <dialog id="event-dialog">
            <div class="header-bar d-flex-row">
                <p class="dialog-header"></p>
                <button type="button" class="close-button" onclick="closeEventDialog()" title="Close">x</button>
            </div>
            <br />

            <form id="event-form" class="form-content">
                <div class="form-field">
                    <input id="event-name" type="text" name="event-name" placeholder="Add event name" required />
                </div>

                <div class="form-field">
                    <textarea id="details" name="details" placeholder="Add description"></textarea>
                </div>

                <div class="form-field">
                    <calendar for="location" class="form-calendar">Location:</calendar><br/>
                    <input id="location" type="text" name="location" />
                </div>

                <div class="form-field">
                    <calendar for="start" class="form-calendar">Date: </calendar><br/>
                    <input id="start" type="datetime-local" name="start" required />
                    <input id="end" type="datetime-local" name="end" required />
                </div>

                <div class="form-field">
                    <select id="recurrence" name="recurrence" required>
                        <option value="0" selected>Does not recurr</option>
                        <option value="1">Daily</option>
                        <option value="2">Weekly</option>
                        <option value="3">Monthly</option>
                        <option value="4">Annually</option>
                    </select>
                </div><br/>

                <div class="form-field">
                    <calendar for="calendar" class="form-calendar">Calendar:</calendar>
                    <select id="calendar-select" name="calendar" required></select>
                </div>

                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Event Create Form End -->

        <!-- Calendar Create Form Start -->
        <dialog id="calendar-dialog">
            <div class="header-bar d-flex-row">
                <p class="dialog-header"></p>
                <button type="button" class="close-button" onclick="closeCalendarDialog()" title="Close">x</button>
            </div>
            <br />

            <form id="calendar-form" class="form-content">
                <div class="form-field">
                    <input id="calendar-name" type="text" name="calendar-name" placeholder="Add calendar name" required />
                </div>
                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Calendar Create Form End -->

        <div class="app">
            <h1>All Events</h1>
            <hr />

            <div class="d-flex-row">
                <button class="button" onclick="openEventDialog()">+ Create Event</button>
                <button class="button" onclick="openCalendarDialog()">+ Create Calendar</button>
            </div>
            
            <div id="calendars" class="calendars"></div>
        </div>

        <ul id="calendar-menu" class="menu">
            <li class="menu-button" id="edit-calendar" onclick="editCalendar()">Rename Calendar</li>
            <li class="menu-button" id="delete-calendar" onclick="deleteCalendar()">Delete Calendar</li>
        </ul>

        <ul id="event-menu" class="menu">
            <li class="menu-button" id="edit-event" onclick="editEvent()">Edit event</li>
            <li class="menu-button" id="delete-event" onclick="deleteEvent()">Delete event</li>
        </ul>
    </body>
</html>
