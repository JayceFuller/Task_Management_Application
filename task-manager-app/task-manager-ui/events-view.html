<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Personal Task Manager | All Events</title>

        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/tasksPage.css" />
        <script src="./js/events.js" defer></script>
        <script src="./js/label.js" defer></script>
        <script src="./js/navbar.js" defer></script>
    </head>

    <header>
        <nav-bar></nav-bar>
    </header>

    <body>
        <!-- Event Form Start -->
        <dialog id="event-dialog">
            <button type="button" class="close-button" onclick="closeEventDialog()">x</button>
            <br />
            <form id="event-form" class="form-content">
                <div class="form-field">
                    <input id="event-name" type="text" name="event-name" placeholder="Add event name" required />
                </div>

                <div class="form-field">
                    <textarea id="details" name="details" placeholder="Add description"></textarea>
                </div>

                <div class="form-field">
                    <label for="location">Location:</label><br/>
                    <input id="location" type="text" name="location" />
                </div>

                <div class="form-field">
                    <label for="start">Date: </label><br/>
                    <input id="start" type="datetime-local" name="start" required />
                    <input id="end" type="datetime-local" name="end" required />
                </div>

                <div class="form-field">
                    <select id="recurrence" name="recurrence" required>
                        <option value="0" selected>Does not recurr</option>
                        <option value="1">Daily</option>
                        <option value="2">Weekly</option>
                        <option value="3">Monthly</option>
                        <option value="4">Annually</option>
                    </select>
                </div><br/>

                <div class="form-field">
                    <label for="label" class="form-label">Label:</label>
                    <select id="label-select" name="label" required></select>
                </div>

                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Event Create Form End -->

        <!-- Label Create Form Start -->
        <dialog id="label-dialog">
            <button type="button" class="close-button" onclick="closeLabelDialog()">x</button>
            <br />
            <form id="label-form" class="form-content">
                <div class="form-field">
                    <input id="label-name" type="text" name="label-name" placeholder="Add label name" required />
                </div>
                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Label Create Form End -->

        <div class="app">
            <h1>All Events</h1>
            <hr />

            <div class="d-flex-row">
                <button class="button" onclick="openEventDialog()">+ Create Event</button>
                <button class="button" onclick="openLabelDialog()">+ Create Label</button>
            </div>
            
            <div id="labels" class="labels"></div>
        </div>

        <ul id="label-menu" class="menu">
            <li class="menu-button" id="edit-label" onclick="editLabel()">Rename label</li>
            <li class="menu-button" id="delete-label" onclick="deleteLabel()">Delete label</li>
        </ul>

        <ul id="event-menu" class="menu">
            <li class="menu-button" id="edit-event" onclick="editEvent()">Edit event</li>
            <li class="menu-button" id="delete-event" onclick="deleteEvent()">Delete event</li>
        </ul>
    </body>
</html>
