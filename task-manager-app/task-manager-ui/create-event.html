<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Personal Task Manager - Create Event</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <script src="./js/create-event.js"></script>
    </head>

    <header>
        <h2>Create an Event: </h2>
    </header>

    <body>
        <div class="app">
            <form id="event-form">
                <div>
                    <label for="name">Name:</label>
                    <input id="name" type="text" name="name" />
                </div>

                <div>
                    <label for="details">Details:</label>
                    <textarea id="details" name="details"></textarea>
                </div>

                <div>
                    <label for="location">Location:</label>
                    <input id="location" type="text" name="location" />
                </div>

                <div>
                    <label for="start">Starts:</label>
                    <input id="start" type="datetime" name="start" />
                </div>

                <div>
                    <label for="end">Ends:</label>
                    <input id="end" type="datetime" name="end" />
                </div>

                <!-- Make this a dropdown -->
                <div>
                    <label for="recurrence">Recurring:</label>
                    <input id="recurrence" type="number" name="recurrence" />
                </div>

                <!-- Make this a dropdown -->
                <div>
                    <label for="group">Group:</label>
                    <input id="group" type="text" name="group" />
                </div>

                <div>
                    <button type="submit">Create Task</button>
                </div>
            </form>
        </div>
    </body>
</html>
