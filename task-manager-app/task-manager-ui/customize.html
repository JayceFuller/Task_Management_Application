<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Personal Task Manager - Customize App</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <script src="./js/customize.js" defer></script>
        <script src="./js/navbar.js"></script>
    </head>

    <header>
        <div id="navbar"></div>
    </header>

    <body>
        <div id="err"></div>

        <div class="app">
            <h2>Customize App Display</h2>
            <hr />

            <!-- Change background -->
            <div>
                <label>Background Color</label>
                <input id="background-picker" type="color" />
            </div>
            <!-- Change font style -->
            <!-- Change font color -->
            <div>
                <label>Font color</label>
                <input id="font-color-picker" type="color" />
            </div>
            <!-- Change accent color -->
            <div>
                <label>Accent Color</label>
                <input id="accent-picker" type="color" />
            </div>
        </div>
    </body>
</html>
