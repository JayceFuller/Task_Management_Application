<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Personal Task Manager - All Tasks</title>

        <link rel="stylesheet" href="./css/styles.css" />
        <link rel="stylesheet" href="./css/tasksPage.css">
        <script src="./js/tasks.js" defer></script>
        <script src="./js/lists.js" defer></script>
        <script src="./js/navbar.js"></script>
    </head>

    <header>
        <div id="navbar"></div>
    </header>

    <body>
        <!-- Task Form Start -->
        <dialog id="task-dialog">
            <div class="header-bar">
                <button type="button" class="close-button" onclick="closeCreateForm()" title="Close">x</button>
            </div>
            <br />
            
            <form id="task-form" class="form-content">
                <div class="form-field">
                    <input id="task-name" type="text" name="task-name" form="taskForm" placeholder="Add task name" required />
                </div>

                <div class="form-field">
                    <label for="due" class="form-label">Duedate:</label><br/>
                    <input id="due" type="datetime-local" form="taskForm" name="due" required />
                </div>

                <div class="d-flex-row">
                    <input id="all-day" type="checkbox" name="all-day" form="taskForm" />
                    <label for="all-day" class="form-label">All Day</label>
                </div>

                <div class="form-field">
                    <select id="recurrence" name="recurrence" form="taskForm" required>
                        <option value="0" selected>Does not recurr</option>
                        <option value="1">Daily</option>
                        <option value="2">Weekly</option>
                        <option value="3">Monthly</option>
                        <option value="4">Annually</option>
                    </select>
                </div><br/>

                <div class="form-field">
                    <textarea id="details" name="details" form="taskForm" placeholder="Add description"></textarea>
                </div>

                <div class="form-field">
                    <label for="list" class="form-label">List:</label>
                    <select id="list-select" name="list" form="taskForm" required></select>
                </div>

                <div class="form-field">
                    <label for="level" class="form-label">Priority:</label>
                    <select id="level" name="level" form="taskForm" required>
                        <option value="0" selected>None</option>
                        <option value="1">!Low</option>
                        <option value="2">!!Medium</option>
                        <option value="3">!!!High</option>
                    </select>
                </div>

                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Task Form End -->

        <!-- List Form Start -->
        <dialog id="list-dialog">
            <div class="header-bar">
                <button type="button" class="close-button" onclick="closeListDialog()" title="Close">x</button>
            </div>

            <form id="list-form" class="form-content">
                <div class="form-field">
                    <input id="list-name" type="text" name="list-name" placeholder="Add list name"/>
                </div>
                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- List Form End -->

        <div class="app">
            <h2>All Tasks</h2>
            <hr />
            <button class="button" onclick="openCreateForm()">+ Create Task</button>
            <button class="button" onclick="openListDialog()">+ Create List</button>
            
            <div id="lists"></div>
        </div>

        <ul id="list-menu" class="menu">
            <li class="menu-button" id="edit-list" onclick="editList()">Rename list</li>
            <li class="menu-button" id="delete-list" onclick="deleteList()">Delete list</li>
            <hr/>
            <li class="menu-button" id="delete-completed" onclick="deleteCompleted()">Delete completed tasks</li>
        </ul>

        <ul id="task-menu" class="menu">
            <li class="menu-button" id="edit-task" onclick="editTask()">Edit task</li>
            <li class="menu-button" id="delete-task" onclick="deleteTask()">Delete task</li>
        </ul>
    </body>
</html>
