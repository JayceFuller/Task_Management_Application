<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Personal Task Manager - All Tasks</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <script src="./js/tasks.js" defer></script>
        <script src="./js/navbar.js"></script>
    </head>

    <header>
        <div id="navbar"></div>
    </header>

    <body>
        <!-- Error Dialog -->
        <dialog id="err"></dialog>

        <!-- Task Create Form Start -->
        <dialog id="taskDialog">
            <button type="button" class="close-button" onclick="closeTaskDialog()">x</button>
            <br />
            <form id="taskForm" class="form-content">
                <div class="form-field">
                    <input id="task-name" type="text" name="task-name" placeholder="Add task name" required />
                </div>

                <div class="form-field">
                    <textarea id="details" name="details" placeholder="Add description"></textarea>
                </div>

                <div class="form-field">
                    <label for="due" class="form-label">Duedate:</label><br/>
                    <input id="due" type="datetime-local" name="due" required />
                </div>

                <div class="form-field">
                    <select id="recurrence" name="recurrence" form="taskForm" required>
                        <option value="0" selected>Does not recurr</option>
                        <option value="1">Daily</option>
                        <option value="2">Weekly</option>
                        <option value="3">Monthly</option>
                        <option value="4">Annually</option>
                    </select>
                </div><br/>

                <div class="form-field">
                    <label for="list" class="form-label">List:</label>
                    <select id="listSelect" name="list" form="taskForm" required></select>
                </div>

                <div class="form-field">
                    <label for="level" class="form-label">Priority:</label>
                    <select id="level" name="level" form="taskForm" required>
                        <option value="0" selected>None</option>
                        <option value="1">!Low</option>
                        <option value="2">!!Medium</option>
                        <option value="3">!!!High</option>
                    </select>
                </div>

                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Task Create Form End -->

        <!-- Label Create Form Start -->
        <dialog id="listDialog">
            <button type="button" class="close-button" onclick="closeListDialog()">x</button>
            <br />
            <form id="listForm" class="form-content">
                <div class="form-field">
                    <input id="list-name" type="text" name="list-name" placeholder="Add list name"/>
                </div>
                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Label Create Form End -->

        <div class="app">
            <h2>All Tasks</h2>
            <hr />
            <button class="button" onclick="openTaskDialog()">+ Create Task</button>
            <button class="button" onclick="openListDialog()">+ Create List</button>
            
            <div id="lists"></div>
        </div>
    </body>
</html>
