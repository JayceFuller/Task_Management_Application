<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Personal Task Manager - All Tasks</title>
        <link rel="stylesheet" href="./css/styles.css" />
        <script src="./js/task.js" defer></script>
        <script src="./js/navbar.js"></script>
    </head>

    <header>
        <div id="navbar"></div>
    </header>

    <body>
        <dialog id="err" style="display: none"></dialog>
        <!-- Task Create Form Start -->
        <dialog class="form-popup" style="display: none" id="taskDialog">
            <button type="button" class="close-button" onclick="closeTaskDialog()">x</button>
            <br />
            <form id="taskForm" class="form-content">
                <div class="form-field">
                    <input id="name" type="text" name="name" placeholder="Add task name" required />
                </div>

                <div class="form-field">
                    <textarea id="details" name="details" placeholder="Add description"></textarea>
                </div>

                <div class="form-field">
                    <label for="due">Duedate:</label><br/>
                    <input id="due" type="datetime-local" name="due" required />
                </div>

                <!-- Make this a dropdown -->
                <div class="form-field">
                    <input id="recurrence" type="number" name="recurrence" required />
                </div>

                <!-- Make this a dropdown -->
                <div class="form-field">
                    <label for="level">Priority Level:</label><br/>
                    <input id="level" type="number" name="level" />
                </div>

                <!-- Make this a dropdown -->
                <div class="form-field">
                    <label for="list">Task List:</label><br/>
                    <input id="list" type="number" name="list" required />
                </div>

                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Task Create Form End -->

        <!-- Label Create Form Start -->
        <dialog>
            <form id="labelForm" class="form-content">
                <div class="form-field">
                    <input id="list-name" type="text" name="list-name" placeholder="Add list name"/>
                </div>
                <button type="submit" class="button">Save</button>
            </form>
        </dialog>
        <!-- Label Create Form End -->

        <div class="app">
            <h2>All Tasks</h2>
            <hr />
            <button class="button" onclick="openTaskDialog()">+ Create Task</button>
            <button class="button">+ Create List</button>
            
            <div id="lists"></div>
        </div>
    </body>
</html>
